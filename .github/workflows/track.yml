name: Rastrear videos
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nome do Release com os videos (deixe vazio para usar os videos do repositorio)'
        required: false
        default: ''
      preset:
        description: 'Estilo do recorte'
        type: choice
        default: suave
        options:
          - suave
          - padrao
          - oneeuro
          - rapido
      subject_at:
        description: 'Opcional: x,y (0 a 1) da pessoa a seguir no primeiro quadro. Ex.: 0.75,0.60'
        required: false
        default: ''
      aspect:
        description: 'Formato da saida'
        type: choice
        default: '9:16'
        options:
          - '9:16'
          - '4:5'
          - '1:1'
  push:
    paths:
      - '*.mov'
      - '*.MOV'
      - '*.mp4'
      - '*.MP4'
      - 'videos/**'
      - 'ReframeCore-M1.zip'

permissions:
  contents: write

jobs:
  track:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip
        run: unzip -q ReframeCore-M1.zip
      - name: Compilar
        working-directory: Packages/ReframeCore
        run: swift build -c release --product reframe
      - name: Rastrear e renderizar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRESET: ${{ inputs.preset }}
          ASPECT: ${{ inputs.aspect }}
          SUBJECT_AT: ${{ inputs.subject_at }}
        run: bash Packages/ReframeCore/Scripts/ci-run.sh
      - name: Publicar
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd out || exit 0
          git init -q
          git checkout -q -b ci-tracking
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "tracking ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-tracking
          exit 0
