name: ReframeCore tests
on: [push, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip
        shell: bash
        run: |
          apt-get update && apt-get install -y unzip
          unzip -q ReframeCore-M1.zip
      - name: swift test
        shell: bash
        working-directory: Packages/ReframeCore
        run: swift test 2>&1 | tee swift-test.log; exit ${PIPESTATUS[0]}
      - name: Resultado
        if: always()
        shell: bash
        run: |
          grep -E "Executed [0-9]+ tests" Packages/ReframeCore/swift-test.log | tail -1 | while IFS= read -r l; do echo "::notice::linux: $l"; done
          grep -E "error:|failed" Packages/ReframeCore/swift-test.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip
        run: unzip -q ReframeCore-M1.zip
      - name: swift test
        shell: bash
        working-directory: Packages/ReframeCore
        run: swift test 2>&1 | tee swift-test.log; exit ${PIPESTATUS[0]}
      - name: Resultado
        if: always()
        shell: bash
        run: |
          grep -E "Executed [0-9]+ tests" Packages/ReframeCore/swift-test.log | tail -1 | while IFS= read -r l; do echo "::notice::macos: $l"; done
          grep -E "error:|failed" Packages/ReframeCore/swift-test.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
